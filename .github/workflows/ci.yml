name: legal-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bounded ProjectNexus-friendly 1.7 contract
        shell: bash
        run: node DevTools/validate-rimworld17.mjs --check repository
      - name: Assert RimWorld 1.7 / Waylith-only target
        shell: pwsh
        run: ./DevTools/Test-RimWorld17Contract.ps1
      - name: Verify package and compatibility contract
        shell: pwsh
        run: ./DevTools/Verify-KnowledgeFramework.ps1 -AllowBlockedIntegration
      - name: Verify isolated reference consumer fixture
        shell: pwsh
        run: ./Examples/ReferenceConsumer/Verify-ReferenceConsumer.ps1
      - name: Verify documentation links
        shell: pwsh
        run: ./DevTools/Test-DocumentationLinks.ps1
      - name: Verify development stress contract
        shell: pwsh
        run: ./DevTools/Test-DevelopmentStressContract.ps1
      - name: Install .NET 10 SDK for reference-only compilation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Compile 1.7 framework against published reference assemblies
        shell: bash
        run: dotnet build DevTools/RefCompile/KnowledgeFramework.RefCompile.csproj -c Release --nologo
      - name: Compile reference consumer against the 1.7 framework
        shell: bash
        run: dotnet build DevTools/RefCompile/ReferenceConsumer.RefCompile.csproj -c Release --nologo
      - name: Compile optional bridge adapter against 1.7 reference assemblies
        shell: bash
        run: dotnet build DevTools/RefCompile/KnowledgeFrameworkBridgeAdapter.RefCompile.csproj -c Release --nologo
      - name: Compile behavioral harness against 1.7 reference assemblies
        shell: bash
        run: dotnet build DevTools/RefCompile/KnowledgeFrameworkBehavioralHarness.RefCompile.csproj -c Release --nologo
      - name: Build clearly labeled 1.7 test candidate (NOT a release)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          OUTPUT="$GITHUB_WORKSPACE/.artifacts/ci-game-candidate"
          dotnet build DevTools/RefCompile/KnowledgeFramework.RefCompile.csproj -c Release --nologo -p:AssemblyName=KnowledgeFramework "-p:OutputPath=$OUTPUT/"
          test -f "$OUTPUT/KnowledgeFramework.dll"
          ROOT="$GITHUB_WORKSPACE/.artifacts/package/KnowledgeFramework"
          mkdir -p "$ROOT/1.7/Assemblies"
          cp -R About "$ROOT/"
          cp LoadFolders.xml LICENSE "$ROOT/"
          cp -R 1.7/Defs "$ROOT/1.7/"
          cp -R 1.7/Languages "$ROOT/1.7/"
          cp "$OUTPUT/KnowledgeFramework.dll" "$ROOT/1.7/Assemblies/"
          printf "UNVERIFIED RIMWORLD 1.7 TEST CANDIDATE\\nBuilt from PR source against RimRef 1.7.4990-unstable and Harmony 3.0.0-rc.4.\\nThis is NOT a release. Run only in a disposable 1.7 game/mod setup.\\nRuntime loading, Harmony patching, saved-data behavior and DLC integration have NOT been tested.\\nSource commit: %s\\n" "$GITHUB_SHA" > "$ROOT/UNVERIFIED_TEST_CANDIDATE.txt"
          cd "$GITHUB_WORKSPACE/.artifacts/package"
          zip -qr "$GITHUB_WORKSPACE/.artifacts/KnowledgeFramework-1.7-UNVERIFIED.zip" KnowledgeFramework
      - name: Upload short-lived unverified test candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeFramework-1.7-UNVERIFIED
          path: .artifacts/KnowledgeFramework-1.7-UNVERIFIED.zip
          retention-days: 3
          if-no-files-found: error
      - name: Verify clean diff formatting
        shell: bash
        run: git diff --check
